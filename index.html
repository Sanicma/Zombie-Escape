<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:Impact,'Arial Black',sans-serif;color:#eee}
canvas{display:block;width:100%;height:100%}
#m{position:fixed;inset:0;background:rgba(10,0,0,.82);display:flex;align-items:center;justify-content:center;overflow:auto;text-align:center}
.b{max-width:900px;width:92%;margin:auto;padding:12px}
h1{font-size:64px;margin:0 0 8px;color:#c22;text-shadow:0 0 18px #800;letter-spacing:3px}h1 span{color:#ddd}
h2{color:#c22;margin:4px}h3{margin:6px;color:#ccc}
button{display:block;width:100%;margin:6px 0;padding:11px;font:inherit;font-size:17px;color:#eee;background:#3a1010;border:2px solid #822;border-radius:10px}
button:active{background:#822}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.co{font-size:26px;color:#fc3}
.f{position:fixed;top:12px;width:52px;height:52px;border-radius:26px;background:rgba(0,0,0,.5);border:2px solid #888;color:#fff;font-size:22px;display:none;padding:0}
.pl,.go{background:#2a8a2a;border-color:#6f6;font-size:28px;padding:14px}.go{position:sticky;bottom:0;margin-top:12px}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{margin:0;font-size:15px;padding:8px 4px}.tabs button span{display:block;font-size:30px}.tabs .on{background:#822;border-color:#fc3}
.cds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cd{overflow:hidden;background:#2a1515;border:3px solid #633;border-radius:12px;padding:8px;font-size:15px;cursor:pointer}.cd>img{width:100%;max-width:130px;height:54px;object-fit:contain}.i{display:inline-block;vertical-align:middle;margin-right:6px}.dim{opacity:.25;filter:grayscale(1)}.f .i,.tabs .i,.ic .i{margin:0}.f .i{height:30px}
.cd.eq{border-color:#4c4;background:#142a14}.cd.ow{border-color:#48c}.cd.lk{opacity:.5}
.pr{display:inline-block;background:#fc3;color:#000;border-radius:14px;padding:3px 12px;margin-top:4px;font-size:18px}
.bd{display:inline-block;border-radius:14px;padding:3px 12px;margin-top:4px;font-size:16px;background:#48c}.eq .bd{background:#4c4;color:#000}
.ic{height:54px;display:flex;align-items:center;justify-content:center}.st{word-break:break-all;font-size:13px;letter-spacing:1px;color:#fc3;margin-top:2px}
button small{display:block;font-size:13px;color:#ccc;margin-top:2px;font-family:Arial,sans-serif}.by{margin:-2px 0 12px;font-size:20px;letter-spacing:4px;color:#fc3;text-shadow:0 0 10px #a60}</style></head><body>

function over(){st='over';T={};$('sw').style.display=$('pz').style.display='none';const tu=mode=='horde'&&tl<=0;
if(mode=='story'){if(wave>cfg.sbest)cfg.sbest=wave}else if(mode=='horde'){if(wave>cfg.hbest)cfg.hbest=wave;if(tsv>cfg.ht)cfg.ht=tsv;if(kills>cfg.hk)cfg.hk=kills}else if(wave>cfg.best)cfg.best=wave;save();const sv=mode=='story'&&cfg.sv;
show(`<div style="font-size:70px">${tu?'⏱️':ic('m_dead',72)}</div><h2>${tu?'¡SE ACABÓ EL TIEMPO!':'HAS MUERTO'}</h2><p>${mode=='horde'?'Nivel':'Oleada'} ${wave} · ☠️ ${kills}${mode=='horde'?' · ⏱️ '+fmt(tsv)+' (mejor '+fmt(cfg.ht)+') · récord ☠ '+cfg.hk:''}</p>${sv?`<button class=pl onclick="cont()">⏩ CONTINUAR<small>Desde la oleada ${cfg.sv.wave+1}</small></button>`:''}<button ${sv?'':'class=pl'} onclick="start()">${ic('m_retry',26)} REINTENTAR</button><button onclick="menu()">${ic('m_home',26)} MENÚ</button>`)}
function start(m){hide();newGame(m)}
function opts(){show(`<h2>${ic('m_gear',26)} OPCIONES</h2><button onclick="cfg.snd^=1;save();opts()">${ic(cfg.snd?'m_snd':'m_mute',26)} Sonido: ${cfg.snd?'SÍ':'NO'}</button><button onclick="cfg.vib^=1;save();opts()">${ic('m_vib',26)} Vibración: ${cfg.vib?'SÍ':'NO'}</button><button onclick="cfg.fx=(cfg.fx+1)%3;save();opts()">${ic('m_fx',26)} Efectos: ${['Bajo','Medio','Alto'][cfg.fx]}</button><button onclick="cfg.best=cfg.kills=cfg.sbest=cfg.hbest=cfg.ht=cfg.hk=0;delete cfg.sv;save();opts()">${ic('m_del',26)} Borrar récords</button><button onclick="${st=='pause'?'pauseUI()':'menu()'}">${ic('m_back',26)} Volver</button>`)}
function pause(){if(st!='play')return;st='pause';T={};pauseUI()}
function pauseUI(){show(`<h2>${ic('m_pause',30)} PAUSA</h2><button class=pl onclick="st='play';hide()">${ic('m_play',28)} CONTINUAR</button><button onclick="opts()">${ic('m_gear',26)} OPCIONES</button><button onclick="menu()">${ic('m_home',26)} SALIR AL MENÚ</button>`)}
function gunIcon(k){return U['w_'+k]}
let tab=0;const bars=(n,m=5)=>'●'.repeat(n)+'○'.repeat(m-n);
const AI={p:'a_p',s:'a_s',r:'a_r',f:'a_f',x:'a_x'};
const stars=(l,mx)=>{let h='';for(let i=0;i<mx;i++)h+=`<img class="i${i<l?'':' dim'}" src="${U.s_star}" style="height:13px;margin:0">`;return h};
function shopUI(){const u=P.up,cost={hp:150*(u.hp+1),dm:200*(u.dm+1),sp:120*(u.sp+1)},coin=n=>`<span class=pr>${ic('h_coin',18)} ${n}</span>`;
let h=`<h2>${ic('s_trophy',34)} ¡OLEADA ${wave} SUPERADA!</h2>${mode=='story'?'<div class=st style="font-size:16px">📖 Historia: '+wave+'/50'+(wave%5==0?' · Próximo: '+SC[(wave/5)%10|0].e+' '+SC[(wave/5)%10|0].n:'')+'</div>':''}${mode=='horde'?'<div class=st style="font-size:18px;color:#6ff">⏱️ Tiempo: '+fmt(tl)+' (+15s de bonus)</div>':''}<div class=co>${ic('h_coin',32)} ${P.coins}</div><div class=tabs>`+[['t_w','ARMAS'],['t_a','MUNICIÓN'],['t_u','MEJORAS']].map((x,i)=>`<button class="${tab==i?'on':''}" onclick="tab=${i};shopUI()"><span>${ic(x[0],42)}</span>${x[1]}</button>`).join('')+'</div><div class=cds>';
if(tab==0)for(const k in WP){const w=WP[k],ow=P.own[k],eqp=P.cur==k,pw=Math.max(1,Math.min(5,Math.ceil((w.d*w.p*500/w.r+w.d*w.p*.5)/45))),pc=Math.max(1,Math.min(5,Math.round((1-w.sp/.3)*5)));
h+=`<div class="cd ${eqp?'eq':ow?'ow':P.coins<w.pr?'lk':''}" onclick="${ow?`eq('${k}')`:`buyW('${k}')`}"><img src="${gunIcon(k)}"><div>${w.n}</div><div class=st>${ic('s_power',15)} ${bars(pw)}<br>${ic('s_prec',15)} ${bars(pc)}</div>${eqp?`<span class=bd>${ic('s_check',15)} EN USO</span>`:ow?'<span class=bd>USAR</span>':coin(w.pr)}</div>`}
else if(tab==1)for(const k in AM){const a=AM[k],us=Object.keys(WP).filter(x=>WP[x].a==k);
h+=`<div class="cd ${P.coins<a.pr?'lk':''}" onclick="buyA('${k}')"><div class=ic>${ic(AI[k],46)}</div><div>${a.n}</div><div>${us.map(x=>`<img style="width:44px;margin:0 1px" src="${gunIcon(x)}">`).join('')}</div><div class=st>+${a.pk} · Tienes ${P.am[k]}</div>${coin(a.pr)}</div>`}
else for(const[k,im,n,c,l,mx]of [['hp','u_hp','Vida +30',cost.hp,u.hp,10],['dm','u_dm','Daño +20%',cost.dm,u.dm,10],['sp','u_sp','Velocidad +10%',cost.sp,u.sp,8],['med','u_med','Botiquín +50',100,-1,0]]){
const full=mx>0&&l>=mx;
h+=`<div class="cd ${full?'eq':P.coins<c?'lk':''}" onclick="buyU('${k}',${c})"><div class=ic>${ic(im,46)}</div><div>${n}</div><div class=st>${l>=0?stars(l,mx):'Vida '+Math.round(P.hp)+'/'+P.mh}</div>${full?'<span class=bd>MÁXIMO</span>':coin(c)}</div>`}
h+=`</div><button class=go onclick="hide();nextWave()">${ic('s_go',26)} ¡A LUCHAR! OLEADA ${wave+1}</button>`;
const m=$('m'),sc=m.scrollTop;show(h);m.scrollTop=sc}
function pay(c){if(P.coins<c){beep(100,.15,.1);return 0}P.coins-=c;beep(700,.08,.06,'sine',1.4);return 1}
function eq(k){P.cur=k;shopUI()}
function buyW(k){if(pay(WP[k].pr)){P.own[k]=1;P.cur=k;if(WP[k].a)P.am[WP[k].a]+=AM[WP[k].a].pk}shopUI()}
function buyA(k){if(pay(AM[k].pr))P.am[k]+=AM[k].pk;shopUI()}
const MAXU={hp:10,dm:10,sp:8};
function buyU(k,c){if(k!='med'&&P.up[k]>=MAXU[k]){beep(100,.15,.1);return}if(!pay(c))return shopUI();if(k=='hp'){P.up.hp++;P.mh+=30;P.hp+=30}else if(k=='dm'){P.up.dm++;P.dm+=.2}else if(k=='sp'){P.up.sp++;P.sp*=1.1}else P.hp=Math.min(P.mh,P.hp+50);shopUI()}
menu();
</script></body></html>
